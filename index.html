<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="A small collection of single-page browser tools for printing, formatting and everyday office work. Everything runs locally in your browser.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f172a">
<meta property="og:type" content="website">
<meta property="og:title" content="Browser Tools">
<meta property="og:description" content="Single-page browser tools for printing, formatting and everyday office work. Nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='6'%20fill='%230f172a'/%3E%3Crect%20x='7'%20y='7'%20width='7'%20height='7'%20rx='1.5'%20fill='white'/%3E%3Crect%20x='18'%20y='7'%20width='7'%20height='7'%20rx='1.5'%20fill='%236b8afd'/%3E%3Crect%20x='7'%20y='18'%20width='7'%20height='7'%20rx='1.5'%20fill='%236b8afd'/%3E%3Crect%20x='18'%20y='18'%20width='7'%20height='7'%20rx='1.5'%20fill='white'/%3E%3C/svg%3E">
<title>Browser Tools</title>
<style>
  :root{
    --bg:#eef1f6; --panel:#fff; --ink:#111827; --muted:#6b7280; --line:#d7dce5;
    --accent:#1f6feb; --shadow:0 2px 10px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:inherit;text-decoration:none}

  header{background:#0f172a;color:#fff;padding:26px 22px}
  .head-in{max-width:1080px;margin:0 auto;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.2px}
  header p{margin:6px 0 0;color:#93a3b8;font-size:13.5px;max-width:60ch}
  .priv{margin-left:auto;color:#7dd3a0;font-size:12.5px;white-space:nowrap}

  main{max-width:1080px;margin:0 auto;padding:22px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  #q{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font:inherit;background:#fff;box-shadow:var(--shadow)}
  #q:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .count{font-size:12.5px;color:var(--muted);white-space:nowrap}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:#374151;cursor:pointer}
  .chip:hover{border-color:#9aa5b6}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;transition:transform .12s,box-shadow .12s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,24,40,.13);border-color:#b9c4d6}
  .card.soon{opacity:.62;cursor:default}
  .top{display:flex;align-items:center;gap:10px}
  .icon{font-size:24px;line-height:1}
  .name{font-size:16px;font-weight:600;margin:0}
  .pill{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px}
  .pill.live{background:#e7f5ec;color:#166534}
  .pill.beta{background:#fff4e5;color:#9a3412}
  .pill.planned{background:#eef1f6;color:#6b7280}
  .desc{margin:0;font-size:13.5px;color:#4b5563;flex:1}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11px;color:var(--muted);background:#f3f5f9;border-radius:5px;padding:2px 7px}
  .foot{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
  .open{margin-left:auto;color:var(--accent);font-weight:600}

  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:44px 20px;
    text-align:center;color:var(--muted)}
  footer{max-width:1080px;margin:0 auto;padding:8px 22px 34px;color:var(--muted);font-size:12.5px}
  footer code{background:#e4e8ef;border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div>
      <h1>Browser Tools</h1>
      <p>Small single-page tools for printing, formatting and everyday office work.</p>
    </div>
    <div class="priv">No sign-in &middot; nothing is uploaded</div>
  </div>
</header>

<main>
  <div class="bar">
    <input id="q" type="search" placeholder="Search tools…  (press / to focus)" autocomplete="off" spellcheck="false">
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Add a tool by creating <code>tools/&lt;name&gt;/index.html</code> and adding one entry to <code>tools.js</code>.
</footer>

<script src="tools.js"></script>
<script>
(function () {
  "use strict";

  var TOOLS = (window.TOOLS || []).slice();
  var $ = function (id) { return document.getElementById(id); };
  var activeTag = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // featured first, then live before planned, then newest, then by name
  var rank = { live: 0, beta: 1, planned: 2 };
  TOOLS.sort(function (a, b) {
    if (!!b.featured !== !!a.featured) return b.featured ? 1 : -1;
    var ra = rank[a.status] === undefined ? 1 : rank[a.status];
    var rb = rank[b.status] === undefined ? 1 : rank[b.status];
    if (ra !== rb) return ra - rb;
    if (a.updated !== b.updated) return (b.updated || '').localeCompare(a.updated || '');
    return a.name.localeCompare(b.name);
  });

  function allTags() {
    var seen = {}, out = [];
    TOOLS.forEach(function (t) {
      (t.tags || []).forEach(function (g) {
        if (!seen[g]) { seen[g] = 1; out.push(g); }
      });
    });
    return out.sort();
  }

  function matches(t, q) {
    if (activeTag && (t.tags || []).indexOf(activeTag) === -1) return false;
    if (!q) return true;
    var hay = [t.name, t.description, (t.tags || []).join(' ')].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).every(function (w) { return hay.indexOf(w) > -1; });
  }

  // A folder URL only resolves to index.html on a web server; from disk it lists the
  // directory. Repair such links so the dashboard works either way.
  function linkFor(t) {
    var h = t.href;
    if (!h) return null;
    if (location.protocol === 'file:' && /\/$/.test(h)) h += 'index.html';
    return h;
  }

  function cardHtml(t) {
    var href = linkFor(t);
    var live = t.status !== 'planned' && href;
    var tag = live ? 'a' : 'div';
    var attrs = live ? ' href="' + esc(href) + '"' : '';
    var when = t.updated ? 'Updated ' + esc(t.updated) : '';
    return '<' + tag + attrs + ' class="card' + (live ? '' : ' soon') + '" id="' + esc(t.id) + '">' +
      '<div class="top">' +
        '<span class="icon">' + esc(t.icon || '🔧') + '</span>' +
        '<h2 class="name">' + esc(t.name) + '</h2>' +
        '<span class="pill ' + esc(t.status || 'live') + '">' + esc(t.status || 'live') + '</span>' +
      '</div>' +
      '<p class="desc">' + esc(t.description) + '</p>' +
      '<div class="tags">' + (t.tags || []).map(function (g) {
        return '<span class="tag">' + esc(g) + '</span>';
      }).join('') + '</div>' +
      '<div class="foot"><span>' + when + '</span>' +
        '<span class="open">' + (live ? 'Open →' : 'In progress') + '</span></div>' +
    '</' + tag + '>';
  }

  function render() {
    var q = $('q').value.trim();
    var shown = TOOLS.filter(function (t) { return matches(t, q); });

    $('grid').innerHTML = shown.length
      ? shown.map(cardHtml).join('')
      : '<div class="empty">No tool matches “' + esc(q || activeTag) + '”.</div>';

    $('count').textContent = shown.length + ' of ' + TOOLS.length +
                             ' tool' + (TOOLS.length === 1 ? '' : 's');
  }

  function buildChips() {
    var tags = allTags();
    if (!tags.length) return;
    $('chips').innerHTML =
      '<button class="chip on" data-tag="">All</button>' +
      tags.map(function (g) {
        return '<button class="chip" data-tag="' + esc(g) + '">' + esc(g) + '</button>';
      }).join('');
    $('chips').addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      activeTag = b.dataset.tag;
      Array.prototype.forEach.call($('chips').children, function (c) {
        c.className = 'chip' + (c === b ? ' on' : '');
      });
      render();
    });
  }

  $('q').addEventListener('input', render);
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').value = ''; render(); }
  });

  if (!TOOLS.length) {
    $('grid').innerHTML = '<div class="empty">No tools registered yet — add one to <b>tools.js</b>.</div>';
    $('count').textContent = '';
  } else {
    buildChips();
    render();
  }
})();
</script>
</body>
</html>
