<!doctype html><html lang="en"><meta charset="utf-8"><title>Paint mixer browser checks</title><body><h1>Paint mixer browser checks</h1><pre id="results">Running…</pre><iframe id="app" style="width:1400px;height:1000px;border:0"></iframe><script>
(async()=>{
  const lines=[],frame=document.getElementById('app');let w,d,saved,errors=[],downloads=[];
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const assert=(ok,label)=>{if(!ok)throw Error(label);lines.push('PASS '+label);};
  const input=(id,value,type='change')=>{const el=d.getElementById(id);el.value=value;el.dispatchEvent(new w.Event(type,{bubbles:true}));};
  const click=id=>d.getElementById(id).click();
  async function exported(id){const n=downloads.length;click(id);for(let i=0;i<300&&downloads.length===n;i++)await wait(20);assert(downloads.length>n,id+' downloads');const a=downloads.at(-1);return {name:a.name,blob:await fetch(a.url).then(r=>r.blob())};}
  async function project(){return JSON.parse(await(await exported('exportJSON')).blob.text());}
  async function importRecipe(s){const dt=new w.DataTransfer();dt.items.add(new w.File([JSON.stringify(s)],'recipe.json',{type:'application/json'}));d.getElementById('toast').textContent='';d.getElementById('importRecipe').files=dt.files;d.getElementById('importRecipe').dispatchEvent(new w.Event('change'));for(let i=0;i<200&&!d.getElementById('toast').textContent;i++)await wait(20);return d.getElementById('toast').textContent;}
  async function image(blob){const img=new Image(),url=URL.createObjectURL(blob);await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url;});URL.revokeObjectURL(url);return img;}
  try{
    await new Promise(r=>{frame.onload=r;frame.src='../tools/paint-mixer/index.html';});w=frame.contentWindow;d=w.document;
    saved=w.localStorage.getItem('bt-paint-recipes');w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));w.HTMLAnchorElement.prototype.click=function(){downloads.push({url:this.href,name:this.download});};
    assert(d.querySelectorAll('.ingredient').length===3,'Three initial ingredients');assert(d.getElementById('totalVolume').textContent==='100 ml','Initial 100 ml batch');assert(d.getElementById('medium').options.length===11,'Eleven paint media');
    const renderer=d.getElementById('renderer').textContent;assert(renderer.includes('WEBGL')||renderer.includes('2D PREVIEW'),'Renderer initializes: '+renderer);if(location.search.includes('webgl'))assert(renderer.includes('LIVE 3D'),'WebGL renderer is active');
    input('mixProgress',40,'input');assert(d.getElementById('mixPercent').value==='40%','Animation scrubbing');assert(d.getElementById('play').textContent.includes('Mix'),'Scrubbing pauses animation');
    click('play');assert(d.getElementById('play').textContent.includes('Pause'),'Animation resumes');click('play');
    const state=await project();assert(state.recipe.ingredients.length===3,'JSON exports complete recipe');assert(state.estimate.valid===true,'JSON declares estimate validity');
    assert(!d.querySelector('[data-field=unit] option[value="percentPaint"]'),'Liquid-relative unit is excluded from paint volume units');
    assert(d.getElementById('speed').querySelector('option[value="64"]'),'Playback up to 64x available');input('speed',64);assert(d.getElementById('speed').value==='64','64x selection works');input('speed',1);
    const advance=speed=>{const mock={frame:null,last:1000,running:true,time:0,progress:0,speed,medium:{viscosity:.65},procedure:'swirl',render(){},onProgress(){},request(){}};w.PaintScene.prototype.tick.call(mock,1016);return mock.progress;};assert(Math.abs(advance(64)/advance(1)-64)<1e-6,'64x advances mixing 64 times faster');
    assert(d.querySelectorAll('[data-reference]').length===60,'60 ready-made reference cards');assert(new Set(w.PaintLibrary.recipes.map(p=>p.id)).size===60,'Reference IDs are unique');
    for(const p of w.PaintLibrary.recipes){const r=w.PaintModel.compute({...w.PaintModel.initial(),ingredients:p.ingredients});assert(r.valid&&Math.abs(r.totalMl-100)<1e-6,p.name+' is a complete 100 ml reference');}
    input('referenceCategory','Coastal');assert(d.querySelectorAll('[data-reference]').length===6,'Family filter narrows references');input('referenceSearch','lagoon','input');assert(d.querySelectorAll('[data-reference]').length===1,'Reference search works');d.querySelector('[data-reference]').click();assert(d.getElementById('recipeName').value==='Lagoon','Reference loads ingredients');input('referenceSearch','','input');input('referenceCategory','All');await importRecipe(state);
    click('addLiquid');const li=(field,value,type='change')=>{const e=d.querySelector('[data-lfield='+field+']');e.value=value;e.dispatchEvent(new w.Event(type,{bubbles:true}));};li('amount',25,'input');li('amount',25);
    assert(d.getElementById('finalMl').textContent==='125 ml','Water increases final volume');assert(d.getElementById('concentration').textContent==='80%','Dilution shows 80% paint concentration');assert(+d.getElementById('viscosityMeter').value<65,'Water reduces estimated body');assert(d.getElementById('coatPaint').style.opacity==='0.8','Dilution reduces coat opacity');
    li('unit','percentPaint');assert(+d.querySelector('[data-lfield=amount]').value===25,'Liquid percent converts against paint volume');input('basis','percent');assert(d.getElementById('finalMl').textContent==='125 ml','Percent recipe conversion retains liquid volume');input('batchMl',200);assert(d.getElementById('finalMl').textContent==='250 ml','Paint-batch scaling also scales ratio-based liquid');input('basis','volume');input('batchMl',500);click('scaleBatch');assert(d.getElementById('finalMl').textContent==='500 ml','Rescale targets FINAL volume with additives');
    const wet=await project();assert(wet.recipe.additives.length===1&&wet.estimate.liquidMl===100,'JSON includes liquid and final quantities');assert(wet.estimate.rows.at(-1).kind==='liquid','Export differentiates liquids from pigments');assert((await(await exported('exportCSV')).blob.text()).includes('percentPaint'),'CSV exports liquid unit semantics');
    input('productSystem','solvent');assert(!d.getElementById('liquidWarnings').hidden,'Compatibility mismatch shown');await importRecipe(wet);assert(d.querySelectorAll('[data-liquid]').length===1,'Liquid recipe round-trip');click('undo');click('redo');assert(d.querySelectorAll('[data-liquid]').length===1,'Undo/redo restores liquids');
    li('type','gel');assert(+d.getElementById('viscosityMeter').value>65,'Heavy gel raises body estimate');li('body',10,'input');li('body',10);assert(+d.getElementById('viscosityMeter').value<65,'Custom liquid body changes mixture estimate');
    await importRecipe(state);const snapshots=[];for(const procedure of Object.keys(w.PaintModel.PROCEDURES)){input('procedure',procedure);input('mixProgress',40,'input');const snap=await exported('exportScene');snapshots.push(new Uint8Array(await snap.blob.arrayBuffer()));assert(d.getElementById('procedureSteps').children.length===3,procedure+' includes procedure reference');}
    assert(snapshots.every((bytes,i)=>snapshots.slice(0,i).every(other=>bytes.length!==other.length||bytes.some((b,j)=>b!==other[j]))),'All five procedures render distinct motion patterns');await importRecipe(state);
    let unit=d.querySelector('[data-field=unit]');unit.value='drops';unit.dispatchEvent(new w.Event('change',{bubbles:true}));assert(d.querySelector('[data-field=amount]').value==='600','ml converts to calibrated drops');assert(d.getElementById('totalVolume').textContent==='100 ml','Unit changes preserve volume');
    input('dropMl',.1);assert(d.getElementById('totalVolume').textContent==='130 ml','Drop calibration updates volume');
    input('basis','percent');let next=await project();assert(Math.abs(next.recipe.ingredients.reduce((a,b)=>a+b.amount,0)-100)<1e-8,'Volume-to-percent conversion totals 100');assert(next.recipe.batchMl===130,'Volume-to-percent preserves batch');
    click('addColor');assert(d.querySelectorAll('.ingredient').length===4,'Add arbitrary ingredient');assert(d.querySelectorAll('[data-field=amount]')[3].value==='0','New percent ingredient does not silently alter batch');
    const amount=d.querySelectorAll('[data-field=amount]')[3];amount.value=25;amount.dispatchEvent(new w.Event('input',{bubbles:true}));amount.dispatchEvent(new w.Event('change',{bubbles:true}));assert(!d.getElementById('quantityWarning').hidden,'Overfull percentage is explained');assert(d.getElementById('exportCSV').disabled,'Finished exports require valid percentages');
    click('normalize');assert(d.getElementById('quantityWarning').hidden,'Normalize resolves percentages');click('undo');assert(!d.getElementById('quantityWarning').hidden,'Undo restores pre-normalization');click('redo');assert(d.getElementById('quantityWarning').hidden,'Redo restores normalization');
    input('basis','volume');input('batchMl',500);click('scaleBatch');assert(d.getElementById('totalVolume').textContent==='500 ml','Rescale recipe to 500 ml');
    next=(await project()).recipe;const original=next.ingredients[0].amount;next.ingredients[0].amount=-4;assert((await importRecipe(next)).includes('Invalid'),'Invalid import rejected');assert((await project()).recipe.ingredients[0].amount===original,'Rejected import leaves recipe intact');
    await importRecipe(state);input('medium','watercolor');assert(d.getElementById('sceneMedium').textContent==='Watercolor','Medium updates scene');assert(d.getElementById('coatPaint').style.opacity==='0.5','Watercolor sets simulated coverage');input('coverage',50,'input');assert(d.getElementById('coatPaint').style.opacity==='0.25','Coverage combines with preset');
    for(const medium of ['oil','spray','airbrush','enamel','gouache','ink']){input('medium',medium);assert(d.getElementById('sceneMedium').textContent===w.PaintModel.MEDIA[medium].name,medium+' preset renders');}
    const csv=await exported('exportCSV');assert((await csv.blob.text()).includes('volume_ml'),'CSV includes converted volumes');const txt=await exported('exportTXT');assert((await txt.blob.text()).includes('tint strength'),'TXT includes tint strengths');
    const svg=await exported('exportSVG');assert(!new DOMParser().parseFromString(await svg.blob.text(),'image/svg+xml').querySelector('parsererror'),'SVG recipe card parses');const png=await exported('exportPNG');assert((await image(png.blob)).width===1100,'PNG recipe card decodes');
    input('mixProgress',55,'input');const scene=await exported('exportScene');const sceneImage=await image(scene.blob);assert(sceneImage.width>300&&sceneImage.height>200,'Mixing scene snapshot decodes');const sample=document.createElement('canvas');sample.width=sceneImage.width;sample.height=sceneImage.height;sample.getContext('2d').drawImage(sceneImage,0,0);const pixels=sample.getContext('2d').getImageData(0,0,sample.width,sample.height).data;let painted=0;for(let i=3;i<pixels.length;i+=4)if(pixels[i]>0)painted++;assert(painted>sample.width*sample.height*.05,'Scene contains visible rendered bowl pixels');
    w.print=()=>lines.push('PASS Print invoked');click('printRecipe');assert(d.querySelectorAll('#printSheet tbody tr').length===3,'Print sheet contains all ingredients');
    click('save');assert(+d.getElementById('savedCount').textContent>0,'Save recipe');
    next=structuredClone(state.recipe);next.ingredients=Array.from({length:75},(_,i)=>({...next.ingredients[i%3],name:'Paint '+i}));await importRecipe(next);assert(d.querySelectorAll('.ingredient').length===75,'Large 75-color recipe imports');assert(d.querySelectorAll('#recipeRows tr').length===75,'Large recipe table includes all colors');
    frame.style.width='390px';await wait(80);assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'390px mobile layout fits viewport');frame.style.width='900px';await wait(80);assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'Tablet layout fits viewport');
    next.ingredients.forEach(i=>i.amount=0);await importRecipe(next);assert(d.getElementById('resultHex').textContent==='NO PAINT','Zero recipe has explicit empty state');assert(d.getElementById('play').disabled,'Zero recipe disables mixing');
    assert(errors.length===0,'No runtime errors: '+errors.join(', '));
    document.getElementById('results').textContent=lines.join('\n')+'\nALL CHECKS PASSED ('+lines.length+')';document.title='PASS — Paint mixer';
  }catch(e){document.getElementById('results').textContent=lines.join('\n')+'\nFAIL '+e.stack+'\nRuntime errors: '+errors.join(',');document.title='FAIL — Paint mixer';}
  finally{if(w&&saved!==undefined){if(saved===null)w.localStorage.removeItem('bt-paint-recipes');else w.localStorage.setItem('bt-paint-recipes',saved);}}
})();
</script></body></html>
